name: ci-dgraph-load-tests

on:
  pull_request:
    types:
      - opened
      - reopened
      - synchronize
      - ready_for_review
    branches:
      - main
      - release/**

permissions:
  contents: read

jobs:
  changes:
    uses: ./.github/workflows/detect-changes.yml

  dgraph-load-tests:
    needs: changes
    if: github.event.pull_request.draft == false && needs.changes.outputs.code == 'true'
    runs-on:
      ${{ github.event.repository.owner.type == 'User' && toJSON(github.event.repository.private) ==
      'false' && 'ubuntu-24.04' || 'blacksmith-4vcpu-ubuntu-2404' }}
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5

      - name: Set up Go
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod

      - name: Make Linux Build and Docker Image
        run: make docker-image # this internally builds dgraph binary

      - name: Prepare pinned MinIO source images for public personal repositories
        if:
          github.event.repository.owner.type == 'User' && toJSON(github.event.repository.private) ==
          'false'
        run: |
          contrib/ci-minio/build.sh "$RUNNER_TEMP/ci-minio"
          echo 'MINIO_CURRENT_IMAGE=dgraph/ci-minio:2025-source' >> "$GITHUB_ENV"

      - name: Install gotestsum
        run: go install gotest.tools/gotestsum@latest

      - name: Build Test Binary
        run: |
          #!/bin/bash
          # build the test binary
          cd t; go build .

      - name: Clean Up Environment
        run: |
          #!/bin/bash
          # clean cache
          go clean -testcache
          # clean up docker containers before test execution
          cd t; ./t -r

      - name: Run Load Tests
        run: |
          #!/bin/bash
          # go env settings
          export GOPATH=~/go
          # move the binary
          cp dgraph/dgraph ~/go/bin/dgraph
          # run the load tests
          cd t
          if ${{ github.event.repository.owner.type == 'User' && toJSON(github.event.repository.private) == 'false' }}; then
            python3 ../t/ci-native/observe.py --ticks 60 --output "$RUNNER_TEMP/native-load.jsonl" -- ./t --suite=load
          else
            ./t --suite=load
          fi
          # clean up docker containers after test execution
          ./t -r
          # sleep
          sleep 5

      - name: Retain bounded public-runner observations
        if:
          always() && github.event.repository.owner.type == 'User' &&
          toJSON(github.event.repository.private) == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: native-load-${{ github.run_attempt }}
          path: ${{ runner.temp }}/native-load.jsonl
          if-no-files-found: warn
